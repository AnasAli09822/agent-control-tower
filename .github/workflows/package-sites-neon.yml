name: package-sites-neon
on:
  push:
    branches: [sites-migration, main]
    paths: ['functions/**', 'tests/**', '.github/workflows/package-sites-neon.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --test tests/sites-workload.test.mjs tests/demo-session.test.mjs
      - name: Bundle Sites-specific Neon services
        run: |
          set -euo pipefail
          for name in actcontrol-sites actevents-sites actacceptance; do
            npx --yes @vercel/ncc@0.38.4 build functions/$name/index.mjs -m -o dist/$name
            node --check dist/$name/index.mjs
            (cd dist/$name && zip -9 -q ../$name.zip index.mjs)
          done
          sha256sum dist/*.zip
      - name: Emit transferable public bundle bytes
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const name of ["actcontrol-sites","actevents-sites","actacceptance"]) console.log("ACT_SITES_BUNDLE:" + name + ":" + fs.readFileSync("dist/"+name+".zip").toString("base64"));'
      - uses: actions/upload-artifact@v4
        with:
          name: sites-neon-function-bundles
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
