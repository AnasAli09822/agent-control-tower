name: validate-local-clean-clone
on:
  push:
    branches: [sites-migration, main]
  pull_request:
permissions:
  contents: read
jobs:
  clean-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: controltower
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local_ci_only@127.0.0.1:5432/controltower
      ACT_LOCAL_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm --prefix sites ci
      - run: node scripts/local/bootstrap.mjs
      - run: node --test tests/sites-workload.test.mjs tests/demo-session.test.mjs
      - run: node tests/stepped-acceptance.mjs | tee stepped-acceptance.json
      - name: Run local frontend and signed backend flow
        run: |
          npm run demo > local-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/local/smoke.mjs | tee local-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: clean-clone-acceptance
          path: |
            stepped-acceptance.json
            local-smoke.json
            local-demo.log
