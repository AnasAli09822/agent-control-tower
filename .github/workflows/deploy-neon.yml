name: deploy-neon-functions

on:
  workflow_dispatch:
    inputs:
      target:
        description: Neon branch to deploy
        required: true
        type: choice
        default: validation
        options:
          - validation
          - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CONTROL_API_KEY: ${{ secrets.CONTROL_API_KEY }}
      NEON_PROJECT_ID: weathered-poetry-97205616
      NEON_VALIDATION_BRANCH_ID: br-little-art-b5e06cd8
      NEON_MAIN_BRANCH_ID: br-gentle-butterfly-b57bd2r5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Neon CLI
        run: npm install -g neon@latest
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          test -n "$CONTROL_API_KEY"
      - name: Select branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.target }}" == "main" ]]; then
            echo "NEON_BRANCH_ID=$NEON_MAIN_BRANCH_ID" >> "$GITHUB_ENV"
          else
            echo "NEON_BRANCH_ID=$NEON_VALIDATION_BRANCH_ID" >> "$GITHUB_ENV"
          fi
      - name: Link Neon context
        run: neon set-context --project-id "$NEON_PROJECT_ID" --branch-id "$NEON_BRANCH_ID"
      - name: Plan Neon changes
        run: neon config plan
      - name: Deploy Neon functions
        run: neon deploy
