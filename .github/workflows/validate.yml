name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:source
      - run: npm run build
