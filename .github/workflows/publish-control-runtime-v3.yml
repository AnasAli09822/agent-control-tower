name: publish-control-runtime-v3
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-control-runtime-v3.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run validate:source
      - run: npx --yes @vercel/ncc build functions/actcontrol/index.mjs -o /tmp/control
      - name: Publish isolated control bundle
        run: |
          git switch --orphan runtime-bundles-20260929c
          mkdir -p actcontrol
          cp /tmp/control/index.mjs actcontrol/index.mjs
          sha256sum actcontrol/index.mjs > SHA256SUMS.txt
          git add actcontrol/index.mjs SHA256SUMS.txt
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish final control runtime bundle"
          git push origin runtime-bundles-20260929c
