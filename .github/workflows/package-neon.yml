name: package-neon

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package-neon.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:source
      - name: Check new production routing and anonymous denial
        run: |
          node --input-type=module -e 'for (const [url, expected] of [["https://br-gentle-butterfly-b57bd2r5-actctlp3.compute.c-7.us-east-2.aws.neon.tech/health",200],["https://br-gentle-butterfly-b57bd2r5-actctlp3.compute.c-7.us-east-2.aws.neon.tech/fleet?workspace_id=ws_demo",401],["https://br-gentle-butterfly-b57bd2r5-actevtp3.compute.c-7.us-east-2.aws.neon.tech/health",200],["https://br-gentle-butterfly-b57bd2r5-actevtp3.compute.c-7.us-east-2.aws.neon.tech/token?workspace_id=ws_demo",401],["https://br-gentle-butterfly-b57bd2r5-actevtp3.compute.c-7.us-east-2.aws.neon.tech/stream?workspace_id=ws_demo",401]]) { const response = await fetch(url, {signal:AbortSignal.timeout(20000)}); console.log(JSON.stringify({url,status:response.status,expected})); if(response.status!==expected) throw new Error("public backend HTTP contract failed"); }'
      - name: Bundle Neon Functions
        run: |
          set -euo pipefail
          npx --yes @vercel/ncc@0.38.4 build functions/actcontrol/index.mjs -m -o dist/actcontrol
          npx --yes @vercel/ncc@0.38.4 build functions/actevents/index.mjs -m -o dist/actevents
          node --check dist/actcontrol/index.mjs
          node --check dist/actevents/index.mjs
          (cd dist/actcontrol && zip -9 -q ../actcontrol.zip index.mjs)
          (cd dist/actevents && zip -9 -q ../actevents.zip index.mjs)
          sha256sum dist/actcontrol.zip dist/actevents.zip | tee dist/SHA256SUMS.txt
      - name: Emit transferable public bundle bytes
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const slug of ["actcontrol", "actevents"]) console.log("ACT_BUNDLE:" + slug + ":" + fs.readFileSync("dist/" + slug + ".zip").toString("base64"));'
      - uses: actions/upload-artifact@v4
        with:
          name: neon-function-bundles
          path: |
            dist/actcontrol.zip
            dist/actevents.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
