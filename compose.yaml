services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: controltower
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: local_demo_only
    ports: ['127.0.0.1:5432:5432']
    volumes: ['controltower-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U controltower']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  controltower-data:
